<div class="kt-portlet">
    <div class="kt-portlet__head">
        <div class="kt-portlet__head-label">
            <h5 class="kt-portlet__head-title">Banner Content Ekle</h5>
        </div>
    </div>
    <div class="kt-portlet__body">
        <form [formGroup]="form">
            <div class="form-group row pb-5">
                <div class="col-md-3">
                    <h5>analytics_name</h5>
                </div>
                <div class="col-md-8 contentNoti">
                    <input class="form-control" placeholder="analytics_name" formControlName="analytics_name">
                </div>
            </div>

            <div class="form-group row pb-5">
                <div class="col-md-3">
                    <h5>href_type</h5>
                </div>
                <div class="col-md-8 contentNoti">
                    <input class="form-control" placeholder="href_type" formControlName="href_type">
                </div>
            </div>

            <div class="form-group row pb-5">
                <div class="col-md-3">
                    <h5>href</h5>
                </div>
                <div class="col-md-8 contentNoti">
                    <input class="form-control" placeholder="href" formControlName="href">
                </div>
            </div>

            <div class="form-group row pb-5">
                <div class="col-md-3">
                    <h5>order</h5>
                </div>
                <div class="col-md-8 contentNoti">
                    <input class="form-control" placeholder="order" formControlName="order">
                </div>
            </div>

            <div class="form-group row pb-5">
                <div class="col-md-3">
                    <h5>image_url</h5>
                </div>

                <div class="col-md-8">
                    <div class="custom-file">
                        <input type="hidden" formControlName="image_url" name="image">
                        <input type="file" (change)="onImageSelected($event)" accept=".png, .jpg, .jpeg"
                            class="form-control custom-file-input" id="image" name="image">
                        <label class="custom-file-label" for="image">{{ selectedImage ? selectedImage.name : 'Görsel ekle'}}</label>
                    </div>
                    <img [src]="imageSrc ? imageSrc:'#'"
                        [hidden]="!selectedImage && !imageSrc" class="imagePreview"
                        id="imagePreview">
                </div>
            </div>
        </form>
    </div>

    <div class="kt-portlet__foot text-right">
        <button [ngClass]="{'kt-spinner kt-spinner--right kt-spinner--md kt-spinner--light': loading}"
            class="btn btn-p-orange" [disabled]="form.invalid || loading" (click)="submit()">Kaydet
        </button>
    </div>
</div>
