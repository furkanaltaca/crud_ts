<div class="row">
    <div class="col-md-12">
        <div class="form-group">
            <mat-form-field class="ml-2" appearance="fill">
                <mat-label>Başlangıç Tarihi</mat-label>
                <input matInput (dateChange)="filterJournalReportData('datePicker')" [(ngModel)]="startDateFilter"
                    [matDatepicker]="pickerStart">
                <mat-datepicker-toggle matSuffix [for]="pickerStart"></mat-datepicker-toggle>
                <mat-datepicker #pickerStart></mat-datepicker>
            </mat-form-field>
            <mat-form-field class="ml-2" appearance="fill">
                <mat-label>Bitiş Tarihi</mat-label>
                <input matInput (dateChange)="filterJournalReportData('datePicker')" [(ngModel)]="endDateFilter"
                    [matDatepicker]="pickerEnd" [min]="filterForm.value.startDate">
                <mat-datepicker-toggle matSuffix [for]="pickerEnd"></mat-datepicker-toggle>
                <mat-datepicker #pickerEnd></mat-datepicker>
            </mat-form-field>
            <mat-form-field class="ml-2" appearance="fill">
                <mat-label>Tarih Filtre Seçenekleri</mat-label>
                <mat-select name="selectOptions" [(ngModel)]="dateRangeFilterType" (selectionChange)="filterJournalReportData('dropdown')">
                  <mat-option selected value="custom"> Özel Tarih Aralığı </mat-option>
                  <mat-option value="thisMonth"> Bu Ay </mat-option>
                  <mat-option value="lastSevenDays"> Son 7 gün </mat-option>
                  <mat-option value="lastThirtyDays"> Son 30 gün </mat-option>
                  <mat-option value="lastNinetyDays"> Son 90 gün </mat-option>
                  <mat-option value="lastTwelveMonths"> Son 12 ay </mat-option>
                </mat-select>
              </mat-form-field>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-xl-12">
        <div class="kt-portlet kt-portlet--height-fluid">
            <div class="kt-portlet__body">
                <ng-container *ngIf="journalReportDataLoading == false; else loading">
                    <ng-container *ngIf="journalReports.length > 0; else noData">
                        <table class="table table-striped" matSort (matSortChange)="sortData($event)">
                            <thead>
                                <tr>
                                    <th scope="col" mat-sort-header="date">Tarih</th>
                                    <th scope="col" mat-sort-header="totalCount">Toplam Sayı</th>
                                    <th scope="col" mat-sort-header="personCount">Toplam Kişi Sayı</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr
                                    *ngFor="let journalReport of sortedJournalReports | slice: (filterForm.value.page-1) * filterForm.value.pageSize : (filterForm.value.page-1) * filterForm.value.pageSize + filterForm.value.pageSize; let i = index">
                                    <td scope="row">
                                        <span>
                                            {{ journalReport.date }}
                                        </span>
                                    </td>
                                    <td>
                                        <span>
                                            {{ journalReport.totalCount }}
                                        </span>
                                    </td>
                                    <td>
                                        <span>
                                            {{ journalReport.personCount }}
                                        </span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                        <div class="d-flex justify-content-between p-2">
                            <ngb-pagination [collectionSize]="filterForm.value.colSize" [page]="filterForm.value.page"
                                [maxSize]="5" [rotate]="true" [ellipses]="false" [boundaryLinks]="true"
                                (pageChange)="filterForm.controls.page.setValue($event)"
                                [pageSize]="filterForm.value.pageSize">
                            </ngb-pagination>
                        </div>
                    </ng-container>
                </ng-container>
            </div>
        </div>
    </div>
</div>

<ng-template #loading>
    <div class="m-auto kt-spinner kt-spinner--right kt-spinner--md kt-spinner--blue"></div>
</ng-template>
<ng-template #noData>
    <p class="noData">Gösterilecek veri bulunamadı.</p>
</ng-template>
